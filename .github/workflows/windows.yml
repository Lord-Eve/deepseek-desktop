name: Windows build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  PYTHONUTF8: '1'
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check release workflow behavior
        shell: pwsh
        run: ./tests/release-workflow-checks.ps1
      - name: Build, check native behavior, and package
        shell: powershell
        run: ./tools/publish-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: DeepSeekDesktop-win-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.zip
            dist/*.sha256

