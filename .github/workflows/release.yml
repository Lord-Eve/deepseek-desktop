name: Release Windows desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (for example v0.3.1)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  PYTHONUTF8: '1'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify tag, test, and build
        shell: powershell
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected an existing numeric version tag.' }
          $actual = git describe --tags --exact-match
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:RELEASE_TAG) { throw 'Checkout does not match release tag.' }
          $version = $env:RELEASE_TAG.Substring(1)
          ./tools/publish-windows.ps1 -ExpectedVersion $version
      - uses: actions/upload-artifact@v7
        with:
          name: release-win-x64
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $notes = "docs/releases/$tag.md"
          if (!(Test-Path $notes)) { throw "Missing release notes: $notes" }
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*.sha256' } | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 2) { throw 'Expected one ZIP and one SHA-256 file.' }
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "$tag - Windows desktop" --notes-file $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
